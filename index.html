<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Археологический справочник ARCH34 — Волгоградская область и Нижнее Поволжье.">
  <meta name="theme-color" content="#f5f3ed">
  <title>ARCH34 — Археологический справочник</title>
  <style>
    :root{--ink:#20231f;--paper:#f5f3ed;--white:#fffefa;--muted:#73776e;--line:#deddd5;--olive:#687451;--clay:#a66043;--gold:#d5bd81;--shadow:0 12px 34px #20231f0a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Georgia,"Times New Roman",serif}.wrap{width:min(1160px,100% - 48px);margin:auto}
    .site-header{position:sticky;top:0;z-index:10;background:#f5f3edeb;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{flex:none;color:inherit;text-decoration:none;font:700 14px system-ui;letter-spacing:.12em}.brand span{color:var(--clay)}.nav{display:flex;align-items:center;gap:clamp(10px,2vw,26px);font:13px system-ui}.nav a{position:relative;color:var(--muted);text-decoration:none;padding:27px 0;white-space:nowrap}.nav a:hover,.nav a[aria-current=page]{color:var(--ink)}.nav a[aria-current=page]:after{content:"";position:absolute;bottom:18px;left:0;right:0;height:2px;background:var(--clay)}
    main{min-height:65vh}.hero{padding:88px 0 78px;border-bottom:1px solid var(--line)}.eyebrow{font:650 11px system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--olive)}h1{font:500 clamp(42px,7vw,82px)/1.02 Georgia,serif;letter-spacing:-.045em;max-width:900px;margin:18px 0}.hero p{font-size:20px;color:#5c5e56;max-width:680px;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:38px 0 20px}.section-head h2{font:500 31px/1.15 Georgia,serif;margin:0}.section-head p{font:13px system-ui;color:var(--muted);margin:0}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 0 72px}.card{position:relative;overflow:hidden;min-height:218px;background:var(--white);border:1px solid var(--line);border-radius:7px;padding:24px;display:flex;flex-direction:column;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:var(--gold)}.card .meta{font:11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--clay)}.card h2,.card h3{font:500 27px/1.2 Georgia,serif;margin:14px 0 8px}.card p{color:#5e6059;margin:0 0 22px}.card .arrow{font:600 12px system-ui;color:var(--olive);margin-top:auto}.intro{max-width:820px;min-height:84px;padding:22px 26px;background:#eeece4;border-left:3px solid var(--gold);border-radius:0 5px 5px 0;color:#5e6059}.intro:empty{min-height:34px;padding:0;border:0;background:transparent}.page-hero{padding:62px 0 25px}.page-hero h1{font-size:clamp(42px,6vw,66px);margin:10px 0 24px}.subpages{padding-top:8px}.subpages .card{min-height:170px}
    .work-in-progress{padding:90px 0 130px;text-align:center}.work-in-progress h1{font-size:clamp(42px,6vw,68px);margin:12px auto 14px}.work-in-progress p{color:var(--muted)}.site-footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font:12px system-ui;display:flex;justify-content:space-between;gap:12px}.site-footer a{color:var(--olive);text-decoration:none}
    .journal-tools{display:grid;grid-template-columns:minmax(220px,1fr) minmax(180px,240px) minmax(180px,220px);gap:12px;padding:0 0 22px}.journal-tools label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font:12px system-ui}.journal-tools input,.journal-tools select{width:100%;min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:5px;background:var(--white);color:var(--ink);font:15px system-ui}.journal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 0 72px}.journal-card{overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:transform .18s,border-color .18s}.journal-card:hover{transform:translateY(-3px);border-color:var(--gold)}.journal-cover{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#e7e4da}.journal-cover-placeholder{display:flex;align-items:center;justify-content:center;color:var(--olive);font:13px system-ui;letter-spacing:.12em;background:linear-gradient(135deg,#e8e5da,#d8d6c9)}.journal-card-copy{padding:19px 20px 21px}.journal-card .meta{font:11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--clay)}.journal-card h2{font:500 24px/1.2 Georgia,serif;margin:10px 0}.journal-author{color:#5e6059;font:13px system-ui}.journal-detail{max-width:850px;margin:0 auto;padding:56px 0 90px}.journal-detail h1{font:500 clamp(36px,6vw,66px)/1.08 Georgia,serif;letter-spacing:-.035em;margin:13px 0}.journal-detail .journal-byline{color:var(--muted);font:14px system-ui;margin:0 0 24px}.journal-detail .journal-summary{font-size:21px;line-height:1.55;color:#5c5e56}.journal-detail .journal-cover{aspect-ratio:16/9;border-radius:6px;margin:30px 0}.journal-prose{font:19px/1.85 Georgia,"Times New Roman",serif}.journal-prose h2,.journal-prose h3{font-weight:500;line-height:1.2;margin:1.8em 0 .55em}.journal-prose h2{font-size:32px}.journal-prose h3{font-size:25px}.journal-prose p{margin:0 0 1.2em}.journal-prose ul,.journal-prose ol{padding-left:1.5em;margin:0 0 1.3em}.journal-prose blockquote{margin:1.5em 0;padding:.2em 1.2em;border-left:3px solid var(--gold);color:#5e6059}.journal-prose figure{margin:1.8em 0}.journal-prose figure img{display:block;width:100%;height:auto;border-radius:5px}.journal-prose figcaption{margin-top:8px;text-align:center;color:var(--muted);font:13px/1.5 system-ui}.journal-prose a{color:var(--olive)}.journal-bibliography{border-top:1px solid var(--line);margin-top:38px;padding-top:22px}.journal-bibliography h2{font:500 28px Georgia,serif}.journal-count{color:var(--muted);font:13px system-ui;padding:0 0 18px}
    @media(max-width:900px){.header-inner{align-items:flex-start;flex-direction:column;gap:0;padding:16px 0 0}.nav{width:100%;overflow:auto;gap:20px}.nav a{padding:13px 0 18px}.nav a[aria-current=page]:after{bottom:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:62px 0 54px}}
    @media(max-width:760px){.journal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.journal-tools{grid-template-columns:1fr 1fr}.journal-tools label:first-child{grid-column:1/-1}}
    @media(max-width:560px){.wrap{width:min(100% - 32px,1160px)}.cards{grid-template-columns:1fr}.card{min-height:175px}.section-head{align-items:flex-start;flex-direction:column}.hero p{font-size:18px}.page-hero{padding-top:42px}.site-footer{flex-direction:column}.journal-grid,.journal-tools{grid-template-columns:1fr}.journal-tools label:first-child{grid-column:auto}.journal-detail{padding-top:36px}.journal-prose{font-size:17px}.journal-prose h2{font-size:27px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="/" data-route="/">ARCH<span>34</span></a>
    <nav class="nav" aria-label="Основная навигация" id="navigation"></nav>
  </div></header>
  <main id="app" class="wrap" tabindex="-1"></main>
  <footer class="site-footer wrap"><span>© <span id="year"></span> ARCH34</span><a href="/admin/">Вход для редакции</a></footer>
  <script>
    const topNav=[
      {label:'Главная',path:'/'},{label:'Каменный век',path:'/stone-age'},{label:'Бронзовый век',path:'/bronze-age'},
      {label:'Ранний железный век',path:'/early-iron-age'},{label:'Средние века',path:'/middle-ages'},{label:'Библиотека',path:'/library'},{label:'Новости Археологии Нижнего Поволжья',path:'/news'},{label:'Журнал ARCH34',path:'/journal'},{label:'О нас',path:'/about'}
    ];
    const sections=[
      {label:'Каменный век',path:'/stone-age',code:'Раздел 01',description:'Палеолит, мезолит, неолит и энеолит.'},
      {label:'Бронзовый век',path:'/bronze-age',code:'Раздел 02',description:'Ямная, катакомбная и срубная культурно-исторические общности.'},
      {label:'Ранний железный век',path:'/early-iron-age',code:'Раздел 03',description:'Киммерийцы, савроматы, сарматы и гунны.'},
      {label:'Средние века',path:'/middle-ages',code:'Раздел 04',description:'Раздел в разработке.'},
      {label:'Библиотека',path:'/library',code:'Раздел 05',description:'Раздел в разработке.'},
      {label:'Новости Археологии Нижнего Поволжья',path:'/news',code:'Новости',description:'Новости исследований, экспедиций и археологических открытий.'},
      {label:'Журнал ARCH34',path:'/journal',code:'Журнал',description:'Научно-популярные и авторские статьи об археологии, истории и наследии.'},
      {label:'О нас',path:'/about',code:'Раздел 07',description:'О проекте ARCH34.'}
    ];
    const groups={
      '/stone-age':{title:'Каменный век',code:'Хронология · 01',children:[['Палеолит','/stone-age/paleolithic'],['Мезолит','/stone-age/mesolithic'],['Неолит','/stone-age/neolithic'],['Энеолит','/stone-age/eneolithic']]},
      '/bronze-age':{title:'Бронзовый век',code:'Хронология · 02',children:[['Ямная КИО','/bronze-age/yamnaya'],['Катакомбная КИО','/bronze-age/catacomb'],['Срубная КИО','/bronze-age/srubnaya']]},
      '/early-iron-age':{title:'Ранний железный век',code:'Хронология · 03',children:[['Киммерийское время','/early-iron-age/cimmerian'],['Савроматское время','/early-iron-age/sauromatian'],['Сарматское время','/early-iron-age/sarmatian'],['Гуннское время','/early-iron-age/hunnic']]}
    };
    const childPages=Object.values(groups).flatMap(g=>g.children.map(([title,path])=>({title,path})));
    const allPagePaths=['/','/stone-age','/bronze-age','/early-iron-age','/middle-ages','/library','/news','/about',...childPages.map(x=>x.path)];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    document.getElementById('year').textContent=new Date().getFullYear();
    const nav=document.getElementById('navigation'), app=document.getElementById('app');
    function canonical(path){if(!path||path==='/')return '/';return path.replace(/\/+$/,'')}
    function link(label,path,cls=''){return `<a class="${cls}" href="${path}" data-route="${path}">${esc(label)}</a>`}
    let pageMap={},articles=[],journal=[],journalCategories=[];
    const textBlock=(value,placeholder)=>value?`<div class="intro">${esc(value).replace(/\n/g,'<br>')}</div>`:`<div class="intro"><!-- CONTENT: ${placeholder} --></div>`;
    function render(path){
      path=canonical(path);
      const content=pageMap[path]||{};
      const active=topNav.find(x=>x.path===path)?.path||(path.startsWith('/journal/')?'/journal':null)||Object.entries(groups).find(([,g])=>g.children.some(x=>x[1]===path))?.[0]||'/';
      nav.innerHTML=topNav.map(x=>`<a href="${canonical(x.path)}" data-route="${x.path}" ${x.path===active?'aria-current="page"':''}>${esc(x.label)}</a>`).join('');
      document.title=`${content.title||topNav.find(x=>x.path===path)?.label||Object.values(groups).flatMap(x=>x.children).find(x=>x[1]===path)?.[0]||'ARCH34'} — ARCH34`;
      const pageLabel=content.title||'';
      if(path==='/'){
        app.innerHTML=`<section class="hero"><div class="eyebrow">Научный портал · Нижнее Поволжье</div><h1>Археологический справочник Волгоградской области</h1><p>${content.intro?esc(content.intro):'<!-- CONTENT: краткое описание проекта -->'}</p></section>${content.body?`<section class="intro">${esc(content.body).replace(/\n/g,'<br>')}</section>`:''}<section><div class="section-head"><h2>Разделы справочника</h2><p>Выберите эпоху или тему</p></div><div class="cards">${sections.map(x=>`<a class="card" href="${canonical(x.path)}" data-route="${x.path}"><div class="meta">${x.code}</div><h3>${esc(x.label)}</h3><p>${esc(x.description)}</p><span class="arrow">Открыть раздел →</span></a>`).join('')}</div></section>`;
        return;
      }
      if(groups[path]){
        const g=groups[path], sectionName=g.title;
        const related=articles.filter(a=>a.category===sectionName&&a.published!==false);
        app.innerHTML=`<section class="page-hero"><div class="eyebrow">${g.code}</div><h1>${esc(content.title||g.title)}</h1>${textBlock(content.intro,`вводный текст раздела ${g.title}`)}</section>${content.body?`<section class="intro">${esc(content.body).replace(/\n/g,'<br>')}</section>`:''}<section class="subpages"><div class="section-head"><h2>Периоды и культуры</h2></div><div class="cards">${g.children.map(([title,url],i)=>`<a class="card" href="${canonical(url)}" data-route="${url}"><div class="meta">${g.code} · ${String(i+1).padStart(2,'0')}</div><h3>${esc(title)}</h3><span class="arrow">Открыть страницу →</span></a>`).join('')}</div></section>${articleSection(sectionName,related)}`;
        return;
      }
      if(path==='/news'){
        const items=articles.filter(a=>a.category==='Новости Археологии Нижнего Поволжья'&&a.published!==false);
        app.innerHTML=`<section class="page-hero"><div class="eyebrow">ARCH34 · Нижнее Поволжье</div><h1>Новости Археологии Нижнего Поволжья</h1>${textBlock(content.intro,'вводный текст раздела новостей')}</section>${articleSection('Новости Археологии Нижнего Поволжья',items,'Пока новостей нет. Новые публикации появятся здесь.')}`;return;
      }
      if(path==='/journal'){
        renderJournalCatalog();return;
      }
      if(path.startsWith('/journal/')){
        renderJournalArticle(path.split('/').filter(Boolean).pop());return;
      }
      if(path==='/middle-ages'||path==='/library'){
        app.innerHTML=`<section class="work-in-progress"><div class="eyebrow">ARCH34 · Справочник</div><h1>${path==='/middle-ages'?'Средние века':'Библиотека'}</h1><p>Раздел в разработке</p></section>`;return;
      }
      const child=childPages.find(x=>x.path===path);
      if(child||path==='/about'){
        const title=child?.title||'О нас';const parent=Object.entries(groups).find(([,g])=>g.children.some(x=>x[1]===path));
        app.innerHTML=`<section class="page-hero"><div class="eyebrow">${parent?`<a href="${canonical(parent[0])}" data-route="${parent[0]}" style="color:inherit">${esc(groups[parent[0]].title)}</a> · ARCH34`:'ARCH34 · Проект'}</div><h1>${esc(content.title||title)}</h1>${textBlock(content.intro,`краткое описание страницы ${title}`)}</section><section><div class="section-head"><h2>${path==='/about'?'О проекте':'Материалы страницы'}</h2></div>${textBlock(content.body,`основной текст страницы ${title}`)}</section>`;return;
      }
      app.innerHTML=`<section class="work-in-progress"><div class="eyebrow">ARCH34</div><h1>Страница не найдена</h1>${link('На главную','/')}</section>`;
    }
    function renderJournalCatalog(){
      const categories=[...new Set([...journalCategories.map(c=>c.title),...journal.map(a=>a.category).filter(Boolean)])];
      app.innerHTML=`<section class="page-hero"><div class="eyebrow">ARCH34 · Научно-популярный журнал</div><h1>Журнал ARCH34</h1><div class="intro">Статьи об археологии, истории и культурном наследии Нижнего Поволжья.</div></section><section><div class="section-head"><h2>Публикации</h2><p>Материалы редакции и авторов</p></div><div class="journal-tools"><label>Поиск по журналу<input id="journal-search" type="search" placeholder="Название, автор, тема или слово из текста" autocomplete="off"></label><label>Категория<select id="journal-category"><option value="">Все категории</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Сортировка<select id="journal-sort"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option></select></label></div><div id="journal-count" class="journal-count" aria-live="polite"></div><div id="journal-results" class="journal-grid"></div></section>`;
      const search=document.getElementById('journal-search'),category=document.getElementById('journal-category'),sort=document.getElementById('journal-sort');
      const update=()=>{
        const term=search.value.trim().toLocaleLowerCase('ru'),cat=category.value;
        const items=journal.filter(a=>a.published!==false&&(!cat||a.category===cat)&&(!term||[a.title,a.author,a.summary,a.category,...(a.keywords||[]),a.body].join(' ').toLocaleLowerCase('ru').includes(term))).sort((a,b)=>{const cmp=String(a.date||'').localeCompare(String(b.date||''));return sort.value==='oldest'?cmp:-cmp});
        document.getElementById('journal-count').textContent=items.length?`Публикаций: ${items.length}`:'Пока опубликованных статей нет.';
        document.getElementById('journal-results').innerHTML=items.map(a=>`<a class="journal-card" href="/journal/${encodeURIComponent(a.slug)}" data-route="/journal/${encodeURIComponent(a.slug)}">${a.cover?`<img class="journal-cover" src="${esc(a.cover)}" alt="Обложка статьи «${esc(a.title)}»" loading="lazy">`:`<div class="journal-cover journal-cover-placeholder" aria-hidden="true">ARCH34 · ЖУРНАЛ</div>`}<div class="journal-card-copy"><div class="meta">${esc(a.category||'Журнал ARCH34')}${a.date?' · '+esc(a.date):''}</div><h2>${esc(a.title)}</h2><div class="journal-author">${esc(a.author)}</div></div></a>`).join('');
      };
      search.addEventListener('input',update);category.addEventListener('change',update);sort.addEventListener('change',update);update();
    }
    function markdownInline(source){
      let s=esc(source);
      s=s.replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,(_,alt,url,caption)=>{const safe=/^(https?:\/\/|\/assets\/)/i.test(url)?url:'';return safe?`<figure><img src="${safe}" alt="${alt}" loading="lazy">${caption?`<figcaption>${caption}</figcaption>`:''}</figure>`:`<span>${alt}</span>`});
      s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
      s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>/^(https?:\/\/|mailto:|\/)/i.test(url)?`<a href="${url}" rel="noopener noreferrer">${label}</a>`:label);
      return s;
    }
    function markdownToHtml(markdown){
      const lines=String(markdown||'').replace(/\r/g,'').split('\n'),out=[];let paragraph=[],listType='',quote=[];
      const flushParagraph=()=>{if(paragraph.length){out.push(`<p>${paragraph.map(markdownInline).join('<br>')}</p>`);paragraph=[]}};
      const flushList=()=>{if(listType){out.push(`</${listType}>`);listType=''}};
      const flushQuote=()=>{if(quote.length){out.push(`<blockquote>${quote.map(x=>`<p>${markdownInline(x)}</p>`).join('')}</blockquote>`);quote=[]}};
      for(const line of lines){const t=line.trim();if(!t){flushParagraph();flushList();flushQuote();continue}if(/^!\[[^\]]*\]\(/.test(t)){flushParagraph();flushList();flushQuote();out.push(markdownInline(t));continue}const h=t.match(/^(#{1,3})\s+(.+)$/);if(h){flushParagraph();flushList();flushQuote();const level=h[1].length+1;out.push(`<h${level}>${markdownInline(h[2])}</h${level}>`);continue}const q=t.match(/^>\s?(.*)$/);if(q){flushParagraph();flushList();quote.push(q[1]);continue}flushQuote();const li=t.match(/^([-*]|\d+\.)\s+(.+)$/);if(li){flushParagraph();const next=li[1].endsWith('.')?'ol':'ul';if(listType!==next){flushList();listType=next;out.push(`<${listType}>`)}out.push(`<li>${markdownInline(li[2])}</li>`);continue}flushList();paragraph.push(t)}flushParagraph();flushList();flushQuote();return out.join('');
    }
    function renderJournalArticle(slug){
      const a=journal.find(x=>x.slug===slug&&x.published!==false);
      if(!a){app.innerHTML=`<section class="work-in-progress"><div class="eyebrow">ARCH34 · Журнал</div><h1>Статья не найдена</h1>${link('← К журналу','/journal')}</section>`;return}
      document.title=`${a.title} — Журнал ARCH34`;
      app.innerHTML=`<article class="journal-detail"><div class="eyebrow">${link('Журнал ARCH34','/journal')} · ${esc(a.category||'Археология')}${a.date?' · '+esc(a.date):''}</div><h1>${esc(a.title)}</h1><p class="journal-byline">Автор: ${esc(a.author)}</p>${a.summary?`<p class="journal-summary">${esc(a.summary)}</p>`:''}${a.cover?`<img class="journal-cover" src="${esc(a.cover)}" alt="Обложка статьи «${esc(a.title)}">`:''}<div class="journal-prose">${markdownToHtml(a.body)}</div>${a.bibliography?`<section class="journal-bibliography"><h2>Литература и источники</h2><div class="journal-prose">${markdownToHtml(a.bibliography)}</div></section>`:''}</article>`;
    }
    function articleSection(title,items,emptyText='Публикаций пока нет.'){
      return `<section><div class="section-head"><h2>${esc(title)}</h2></div>${items.length?`<div class="cards">${items.map(a=>`<a class="card" href="/article.html?slug=${encodeURIComponent(a.slug||'')}" data-article><div class="meta">${esc(a.date||'ARCH34')}</div><h3>${esc(a.title||'Без названия')}</h3><p>${esc(a.summary||'')}</p><span class="arrow">Читать материал →</span></a>`).join('')}</div>`:`<div class="intro">${esc(emptyText)}</div>`}</section>`;
    }
    function navigate(path){history.pushState({},'',path);render(path);window.scrollTo(0,0);app.focus({preventScroll:true})}
    document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();navigate(a.dataset.route)});
    window.addEventListener('popstate',()=>render(location.pathname));
    render(location.pathname);
    Promise.all([fetch('/data/pages.json').then(r=>r.ok?r.json():{pages:[]}),fetch('/data/articles.json').then(r=>r.ok?r.json():{articles:[]}),fetch('/data/journal.json').then(r=>r.ok?r.json():{articles:[]}),fetch('/data/journal-categories.json').then(r=>r.ok?r.json():{categories:[]})]).then(([pageData,articleData,journalData,categoryData])=>{pageMap=Object.fromEntries((pageData.pages||[]).filter(p=>p.route).map(p=>[canonical(p.route),p]));articles=articleData.articles||[];journal=journalData.articles||[];journalCategories=categoryData.categories||[];render(location.pathname)}).catch(()=>{});
  </script>
</body>
</html>
