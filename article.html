<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Материал — ARCH34</title><style>:root{--ink:#20231f;--paper:#f5f3ed;--line:#deddd5;--olive:#687451;--clay:#a66043}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.8 Georgia,"Times New Roman",serif}.wrap{max-width:780px;margin:auto;padding:0 24px}.top{border-bottom:1px solid var(--line)}.top .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;font:13px system-ui}.top a{color:var(--olive);text-decoration:none}.brand{font-weight:700;letter-spacing:.1em;color:var(--ink)!important}.article{padding:62px 0 80px}.meta{font:11px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}h1{font:500 clamp(34px,6vw,56px)/1.08 Georgia,serif;letter-spacing:-.03em;margin:14px 0}.summary{font-size:21px;color:#62645d;line-height:1.55}.body{border-top:1px solid var(--line);padding-top:23px;margin-top:28px;white-space:pre-wrap}.author{font:13px system-ui;color:#666;margin-top:34px}.missing{color:#666}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="/">ARCH34</a><a href="/#articles">← Все материалы</a></div></header><main class="wrap article" id="article"><p class="missing">Загрузка материала…</p></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/data/articles.json').then(r=>r.json()).then(d=>{let a=(d.articles||[]).find(x=>x.slug===new URLSearchParams(location.search).get('slug')&&x.published!==false);document.title=a?`${a.title} — ARCH34`:'Материал не найден — ARCH34';document.getElementById('article').innerHTML=a?`<div class="meta">${esc(a.category||'Археология региона')}${a.date?' · '+esc(a.date):''}</div><h1>${esc(a.title)}</h1><p class="summary">${esc(a.summary)}</p><div class="body">${esc(a.body)}</div><div class="author">Автор: ${esc(a.author||'Редакция ARCH34')}${a.bibliography?`<h2>Литература</h2><div>${esc(a.bibliography)}</div>`:''}</div>`:'<p class="missing">Материал не найден.</p>'}).catch(()=>document.getElementById('article').innerHTML='<p class="missing">Не удалось загрузить материал.</p>');</script></body></html>
