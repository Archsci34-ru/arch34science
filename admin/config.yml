backend:
  name: turbo-github
  turbo_site_id: bfbfa809-cbd3-4170-8229-b313b2c5c2b1
  branch: main

publish_mode: editorial_workflow
media_folder: "assets/images"
public_folder: "/assets/images"
locale: "ru"

collections:
  - name: "pages"
    label: "Страницы справочника"
    label_singular: "Страница справочника"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}}"
    sortable_fields: ["title", "route"]
    fields:
      - { label: "Название страницы", name: "title", widget: "string" }
      - { label: "Адрес страницы", name: "route", widget: "select", options: ["/", "/stone-age", "/stone-age/paleolithic", "/stone-age/mesolithic", "/stone-age/neolithic", "/stone-age/eneolithic", "/bronze-age", "/bronze-age/yamnaya", "/bronze-age/catacomb", "/bronze-age/srubnaya", "/early-iron-age", "/early-iron-age/cimmerian", "/early-iron-age/sauromatian", "/early-iron-age/sarmatian", "/early-iron-age/hunnic", "/middle-ages", "/library", "/news", "/journal", "/about"] }
      - { label: "Вводный текст", name: "intro", widget: "text", required: false }
      - { label: "Основной текст", name: "body", widget: "text", required: false }
  - name: "articles"
    label: "Статьи"
    label_singular: "Статья"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}} · {{category}}"
    sortable_fields: ["date", "title", "author"]
    fields:
      - { label: "Название статьи", name: "title", widget: "string" }
      - { label: "Короткое имя для ссылки", name: "slug", widget: "string", hint: "Например, keramika-sarmatov" }
      - { label: "Краткое описание", name: "summary", widget: "text" }
      - label: "Разместить в разделе сайта"
        name: "category"
        widget: "select"
        hint: "Выберите, где эта статья должна появиться на сайте. Для новостей выберите раздел новостей."
        options:
          - "Каменный век"
          - "Бронзовый век"
          - "Ранний железный век"
          - "Средние века"
          - "Библиотека"
          - "Новости Археологии Нижнего Поволжья"
      - { label: "Автор", name: "author", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: "Иллюстрация", name: "image", widget: "image", required: false }
      - { label: "Текст статьи", name: "body", widget: "text" }
      - { label: "Литература и источники", name: "bibliography", widget: "text", required: false }
  - name: "journal"
    label: "Журнал ARCH34"
    label_singular: "Статья журнала"
    folder: "content/journal"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}} · {{author}}"
    sortable_fields: ["date", "title", "author", "category"]
    fields:
      - { label: "Название статьи", name: "title", widget: "string" }
      - { label: "Короткий адрес статьи", name: "slug", widget: "string", hint: "Латинскими буквами и через дефис, например: istoriya-poseleniya" }
      - { label: "ФИО автора", name: "author", widget: "string" }
      - { label: "Краткое описание", name: "summary", widget: "text", required: false }
      - { label: "Обложка статьи", name: "cover", widget: "image", required: false }
      - label: "Категория"
        name: "category"
        widget: "relation"
        collection: "journal-categories"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        hint: "Выберите категорию. Чтобы добавить новую, сначала создайте её в разделе «Категории журнала»."
      - { label: "Ключевые слова", name: "keywords", widget: "list", field: { label: "Слово или выражение", name: "keyword", widget: "string" }, required: false, hint: "По этим словам читатели смогут найти статью через поиск." }
      - { label: "Текст статьи", name: "body", widget: "richtext", modes: ["rich_text", "raw"], hint: "Вставляйте текст и изображения в редакторе. Для подписи под иллюстрацией переключитесь в режим исходного текста и добавьте к ссылке подпись в кавычках: ![Описание](путь-к-файлу \"Подпись к изображению\")." }
      - { label: "Литература и источники", name: "bibliography", widget: "richtext", modes: ["rich_text", "raw"], required: false }
      - { label: "Дата публикации", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: "Опубликована на сайте", name: "published", widget: "boolean", default: true, hint: "Выключите, чтобы снять статью с сайта после сохранения и публикации изменений." }
  - name: "journal-categories"
    label: "Категории журнала"
    label_singular: "Категория журнала"
    folder: "content/journal-categories"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}}"
    sortable_fields: ["title"]
    fields:
      - { label: "Название категории", name: "title", widget: "string" }
      - { label: "Короткое описание", name: "description", widget: "text", required: false }
